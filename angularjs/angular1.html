<!--Write a program to delete one of the names from the array of student names.-->
<!DOCTYPE html>
<html ng-app="studentApp">
<head>
    <title>Delete Student Name</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="studentCtrl">

    <h2>Student Names</h2>

    <ul>
        <li ng-repeat="name in students">
            {{ name }}
            <button ng-click="deleteName($index)">Delete</button>
        </li>
    </ul>

    <script>
        var app = angular.module("studentApp", []);

        app.controller("studentCtrl", function($scope) {
            $scope.students = ["Sahil", "Yash", "Dharna", "Prathamesh", "Jayashri", "Shreya", "Dnyati"];

            $scope.deleteName = function(index) {
                $scope.students.splice(index, 1);
            };
        });
    </script>

</body>
</html>
