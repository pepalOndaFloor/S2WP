<!--Writ a program to enter your e-mail address in the input field. 
Display the status of e-mail where it is valid or dirty using angular JS-->
<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Email Status</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">

    <h3>Email Status</h3>

    <form name="myForm" novalidate>
        <input type="email"
               name="email"
               ng-model="email"
               required
               placeholder="Enter your email">

        <p>Valid: {{ myForm.email.$valid }}</p>
        <p>Dirty: {{ myForm.email.$dirty }}</p>
    </form>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function($scope) {
            $scope.email = "";
        });
    </script>

</body>
</html>
