<!--Write a program to insert some HTML after all paragraphs using jQuery.-->
<!DOCTYPE html>
<html>
<head>
    <title>Insert HTML After Paragraphs</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Insert HTML After All Paragraphs</h2>

    <p>First paragraph</p>
    <p>Second paragraph</p>
    <p>Third paragraph</p>

    <button id="btn">Insert HTML</button>

    <script>
        $(document).ready(function() {
            $("#btn").click(function() {
                $("p").after("<h3 style='color:blue'>Hello World!</h3>");
            });
        });
    </script>

</body>
</html>
