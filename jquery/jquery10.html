<!--Build a program to set default value in input text using jQuery.
(Repeated refer jquery3.html)-->
<!DOCTYPE html>
<html>
<head>
    <title>Set Default Value</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Set Default Value Using jQuery</h2>

    <input type="text" id="name">

    <script>
        $(document).ready(function() {
            $("#name").val("Rahul");
        });
    </script>

</body>
</html>
