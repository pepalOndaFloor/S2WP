<!--Write a program to Set default value in input text using jQuery.-->
<!DOCTYPE html>
<html>
<head>
    <title>Set Default Value</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Set Default Value Using jQuery</h2>

    <input type="text" id="name" placeholder="Enter your name">

    <button id="btn">Set Default Value</button>

    <script>
        $(document).ready(function() {
            $("#btn").click(function() {
                $("#name").val("Prathamesh");
            });
        });
    </script>

</body>
</html>
