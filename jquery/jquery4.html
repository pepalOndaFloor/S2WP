<!--Write a program to Insert a DOM element after all paragraphs-->
<!DOCTYPE html>
<html>
<head>
    <title>Insert DOM Element</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Insert Element After All Paragraphs</h2>

    <p>First paragraph</p>
    <p>Second paragraph</p>
    <p>Third paragraph</p>

    <button id="btn">Insert Element</button>

    <script>
        $(document).ready(function() {
            $("#btn").click(function() {
                $("p").after("<b>Hello World!</b><br>");
            });
        });
    </script>

</body>
</html>
