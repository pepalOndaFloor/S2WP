<!--Write a program for When you change the name in the input field, 
the changes will affect the model, and it will also affect the name property in the controller.-->
<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>AngularJS Model</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">

    <h3>Change Name</h3>

    <input type="text" ng-model="name">

    <p>Entered Name: {{ name }}</p>
    <p>Controller Name: {{ name }}</p>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function($scope) {
            $scope.name = "Rahul";
        });
    </script>

</body>
</html>
