<!--Write a program to display the checked attribute and property 
of a checkbox as it changes Using jQuery.-->
<!DOCTYPE html>
<html>
<head>
    <title>Checkbox Attribute and Property</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Checkbox Checked Status</h2>

    <input type="checkbox" id="myCheck">
    <label for="myCheck">Check Me</label>

    <p>Checked Attribute: <span id="attr"></span></p>
    <p>Checked Property: <span id="prop"></span></p>

    <script>
        $(document).ready(function() {
            $("#myCheck").change(function() {
                var attr = $(this).attr("checked");
                var prop = $(this).prop("checked");

                $("#attr").text(attr);
                $("#prop").text(prop);
            });
        });
    </script>

</body>
</html>
